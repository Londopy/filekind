[workspace]
resolver = "2"
members = [
    "crates/filekind-core",
    "crates/filekind-cli",
    "crates/filekind-gui/src-tauri",
]
# The GUI is excluded from the default set on purpose: building it needs
# webkit2gtk and a Node toolchain, and `cargo test` on a headless CI box
# should not require either. `cargo build -p filekind-gui` opts in.
default-members = [
    "crates/filekind-core",
    "crates/filekind-cli",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.77"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Londopy/filekind"
authors = ["London (Londopy)"]

[workspace.dependencies]
filekind-core = { path = "crates/filekind-core", version = "0.5.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
minijinja = { version = "2", default-features = false, features = ["builtins", "serde"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
ico = "0.4"
icns = "0.3"
base64 = "0.22"
insta = "1"
ts-rs = "10"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
