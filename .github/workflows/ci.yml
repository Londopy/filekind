name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  core:
    name: core + cli (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      # `--features kaitai` rather than `--all-features` on purpose: the
      # `typescript` feature pulls in ts-rs, whose derive emits warnings about
      # serde attributes it does not understand. Those are noise, not lints,
      # and this job runs with `-D warnings`. The bindings job below exercises
      # that feature separately.
      - name: Clippy
        run: cargo clippy --workspace --exclude filekind-gui --all-targets --features kaitai

      # Golden files are per-platform only in the sense that the *tests* run
      # everywhere; the generated artifacts are byte-identical on all three,
      # which is the property being checked.
      - name: Test
        run: cargo test --workspace --exclude filekind-gui --features kaitai

      - name: Dogfood — filekind registers its own file type
        run: |
          cargo run -p filekind-cli -- check examples/filekind.filekind
          cargo run -p filekind-cli -- build examples/filekind.filekind -o dist
        shell: bash

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned deliberately: this job exists to catch a dependency quietly
      # raising the floor. Dependabot is told to leave it alone.
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      # --locked so the MSRV is checked against the versions we actually ship,
      # not whatever a fresh resolve would pick.
      - run: cargo check --workspace --exclude filekind-gui --locked

  bindings:
    name: TypeScript bindings are up to date
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The TS types are generated from the Rust definitions. If someone
      # edits a struct without regenerating, this job notices.
      # Invoked through `bash` rather than executed directly: a checkout on a
      # filesystem without a permission bit would otherwise fail with EACCES.
      - run: bash scripts/generate-bindings.sh
      - run: git diff --exit-code crates/filekind-gui/src/lib/bindings

  gui:
    name: gui (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Tauri needs webkit2gtk at build *and* runtime on Linux. Forgetting
      # this is the single most common first-build failure.
      - name: Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: crates/filekind-gui
        shell: bash
        run: |
          # `npm ci` needs a committed lock file. Fall back until one exists so
          # a fresh clone is not blocked on it.
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Stage the CLI sidecar the bundler expects
        shell: bash
        run: bash scripts/stage-cli-sidecar.sh

      - name: Type-check the frontend
        working-directory: crates/filekind-gui
        run: npm run check

      # `tauri build` is a release build of three hundred crates, so a plain
      # type error costs four minutes to discover at the very end. Check first:
      # same compiler errors, no codegen, and the failure says which layer
      # broke rather than "failed to build app".
      - name: Type-check the Rust
        run: cargo check -p filekind-gui --locked

      - name: Build the app
        working-directory: crates/filekind-gui
        run: npm run tauri build -- --no-bundle
